[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 77.0.3"]

[project]
authors = [{name = "NOAA - Geophysical Fluid Dynamics Laboratory", email = "oliver.elbert@noaa.gov"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "f90nml>=1.1.0",
  "numpy==1.26.4",
  "xarray"
]
description = "pySHiELD is a collection of NDSL-based physical parameterizations"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
name = "pyshield"
readme = "README.md"
requires-python = ">=3.11.7, <3.13"
version = "0.2.0"

[project.optional-dependencies]
dev = [
  "pyshield[test]",
  "pyshield[ndsl]",
  "pyshield[pyfv3]",
  "pre-commit",
  "flake8-pyproject"
]
extras = [
  "pyshield[test]",
  "pyshield[ndsl]",
  "pyshield[pyfv3]",
  "pyshield[dev]"
]
# TODO: Revert ndsl, pyfv3 back to GFDL develop (not jjuyeonkim) after merging https://github.com/NOAA-GFDL/NDSL/issues/64
ndsl = ["ndsl @ git+https://github.com/jjuyeonkim/NDSL.git@20250908_namelist_2"]
pyfv3 = ["pyfv3 @ git+https://github.com/jjuyeonkim/PyFV3.git@20250908_namelist_2"]
test = [
  "pytest",
  "pytest-subtests",
  "serialbox",
  "coverage"
]

[project.urls]
# TODO: Revert repo back to GFDL develop (not jjuyeonkim) after merging https://github.com/NOAA-GFDL/NDSL/issues/64
Repository = "https://github.com/jjuyeonkim/PySHiELD"

[tool.aliases]

[tool.black]
line-length = 88
target_version = ['py311']

[tool.coverage.run]
branch = true
omit = [
  "tests/*",
  "*gt_cache*",
  ".dacecache*",
  "external/*",
  "__init__.py"
]
parallel = true
source_pkgs = ["pyshield"]

[tool.flake8]
exclude = ["docs"]
extend-ignore = ["W503", "E302", "E203", "F841"]
max-line-length = 88

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = "pyfv3,ndsl,pyshield"
known_third_party = "f90nml,pytest,xarray,numpy,mpi4py,gt4py"
line_length = 88
lines_after_imports = 2
multi_line_output = 3
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
use_parentheses = true

[tool.mypy]
exclude = ["tests/conftest.py"]
explicit_package_bases = true
follow_imports = "normal"
ignore_missing_imports = true
namespace_packages = true
strict_optional = false
warn_unreachable = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyshield", "pyshield.*"]
